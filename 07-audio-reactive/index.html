<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio-Reactive Dither</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      min-height: 100vh;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #333;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 57px);
    }

    .sidebar {
      width: 280px;
      flex-shrink: 0;
      padding: 1.25rem;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .stage {
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      overflow: auto;
      position: relative;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: #aaa;
    }

    label span.label-text {
      font-weight: 500;
      color: #ccc;
    }

    input[type="range"], input[type="file"] {
      width: 100%;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .range-row output {
      min-width: 2.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #e8e8e8;
    }

    button {
      padding: 0.6rem 1rem;
      background: #3a6ea5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover { background: #4a7eb5; }
    button:disabled { opacity: 0.4; cursor: default; }

    .stage-wrap {
      position: relative;
      display: inline-block;
      line-height: 0;
    }

    #glcanvas {
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #111;
    }

    #meter {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    #status, #fps, #levelOut {
      font-size: 0.85rem;
      color: #888;
      font-variant-numeric: tabular-nums;
    }

    #status.error { color: #ff6b6b; }

    .readouts {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <header>Audio-Reactive Dither</header>
  <div class="layout">
    <aside class="sidebar">
      <button type="button" id="startBtn">&#9658; Start Audio</button>
      <button type="button" id="micBtn">&#127908; Use Mic</button>

      <label>
        <span class="label-text">Load audio file</span>
        <input type="file" id="fileInput" accept="audio/*">
      </label>

      <label>
        <span class="label-text">Sensitivity</span>
        <div class="range-row">
          <input type="range" id="sensitivity" min="0.5" max="3" step="0.05" value="1.0">
          <output id="sensitivityOut">1.00</output>
        </div>
      </label>

      <p id="status">initializing&hellip;</p>
      <p id="levelOut">level &mdash;</p>
      <p id="fps">&mdash;</p>
    </aside>

    <main class="stage">
      <div class="stage-wrap">
        <canvas id="glcanvas"></canvas>
        <canvas id="meter" width="160" height="80"></canvas>
      </div>
      <div class="readouts">
        <span id="srcOut">source: &mdash;</span>
      </div>
    </main>
  </div>

  <img id="sampleImg" crossorigin="anonymous" alt="" style="display:none">
  <audio id="audioEl" hidden crossorigin="anonymous"></audio>

  <script type="module" src="./main.js"></script>
</body>
</html>
