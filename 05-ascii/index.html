<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Dither</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      min-height: 100vh;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #333;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 57px);
    }

    .sidebar {
      width: 300px;
      flex-shrink: 0;
      padding: 1.25rem;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      overflow-y: auto;
    }

    .preview {
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
      overflow: auto;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: #aaa;
    }

    label span.label-text {
      font-weight: 500;
      color: #ccc;
    }

    select, input[type="range"] {
      width: 100%;
    }

    select {
      padding: 0.4rem;
      background: #2a2a2a;
      color: #e8e8e8;
      border: 1px solid #444;
      border-radius: 4px;
    }

    input[type="color"] {
      width: 100%;
      height: 2rem;
      padding: 0;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2a2a2a;
      cursor: pointer;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .range-row output {
      min-width: 2.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #e8e8e8;
    }

    .checkbox-label {
      flex-direction: row;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .checkbox-label input {
      width: auto;
    }

    .file-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .file-row input[type="file"] {
      font-size: 0.8rem;
    }

    #fileName {
      font-size: 0.75rem;
      color: #888;
      word-break: break-all;
    }

    .view-toggle {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
    }

    .view-toggle label {
      flex-direction: row;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
    }

    .view-toggle input {
      width: auto;
    }

    button {
      padding: 0.6rem 1rem;
      background: #3a6ea5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover:not(:disabled) {
      background: #4a7eb5;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #asciiOutput {
      font-family: monospace;
      white-space: pre;
      user-select: text;
      line-height: 1;
      margin: 0;
      padding: 0.5rem;
      max-width: 100%;
      overflow: auto;
    }

    #exportCanvas {
      max-width: 100%;
    }

    #gridReadout {
      font-size: 0.85rem;
      color: #888;
      font-variant-numeric: tabular-nums;
    }

    label.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .output-wrap {
      width: 100%;
      overflow: auto;
    }
  </style>
</head>
<body>
  <header>ASCII Dither</header>
  <div class="layout">
    <aside class="sidebar">
      <div class="file-row">
        <label>
          <span class="label-text">Load image</span>
          <input type="file" id="fileInput" accept="image/*">
        </label>
        <span id="fileName">01a.png</span>
      </div>

      <label>
        <span class="label-text">Columns</span>
        <div class="range-row">
          <input type="range" id="columns" min="20" max="300" step="1" value="80">
          <output id="columnsOut">80</output>
        </div>
      </label>

      <label>
        <span class="label-text">Ramp</span>
        <select id="ramp">
          <option value="classic">Classic</option>
          <option value="blocks">Blocks</option>
          <option value="audio">Audio meter</option>
        </select>
      </label>

      <label>
        <span class="label-text">Contrast</span>
        <div class="range-row">
          <input type="range" id="contrast" min="0.25" max="3" step="0.05" value="1">
          <output id="contrastOut">1.00</output>
        </div>
      </label>

      <label>
        <span class="label-text">Brightness</span>
        <div class="range-row">
          <input type="range" id="brightness" min="-128" max="128" step="1" value="0">
          <output id="brightnessOut">0</output>
        </div>
      </label>

      <label class="checkbox-label">
        <input type="checkbox" id="invert">
        <span class="label-text">Invert</span>
      </label>

      <label>
        <span class="label-text">Font size</span>
        <div class="range-row">
          <input type="range" id="fontSize" min="6" max="24" step="1" value="10">
          <output id="fontSizeOut">10</output>
        </div>
      </label>

      <label>
        <span class="label-text">Foreground</span>
        <input type="color" id="fgColor" value="#d6ff00">
      </label>

      <label>
        <span class="label-text">Background</span>
        <input type="color" id="bgColor" value="#0a0a0a">
      </label>

      <label class="checkbox-label">
        <input type="checkbox" id="dither" checked>
        <span class="label-text">Dither (Bayer)</span>
      </label>

      <label id="ditherStrengthLabel">
        <span class="label-text">Dither strength</span>
        <div class="range-row">
          <input type="range" id="ditherStrength" min="0" max="2" step="0.05" value="0.8">
          <output id="ditherStrengthOut">0.80</output>
        </div>
      </label>

      <button type="button" id="copyBtn">Copy text</button>
      <button type="button" id="downloadBtn" disabled>Download PNG</button>
    </aside>

    <main class="preview">
      <div class="view-toggle">
        <span class="label-text" style="color:#ccc;font-weight:500;">View:</span>
        <label>
          <input type="radio" name="viewMode" id="viewModeText" value="text" checked>
          Text (&lt;pre&gt;)
        </label>
        <label>
          <input type="radio" name="viewMode" id="viewModeCanvas" value="canvas">
          Canvas
        </label>
      </div>

      <div class="output-wrap">
        <pre id="asciiOutput"></pre>
        <canvas id="exportCanvas" hidden></canvas>
      </div>

      <p id="gridReadout">—</p>
    </main>
  </div>

  <canvas id="srcCanvas" hidden></canvas>

  <script type="module" src="./main.js"></script>
</body>
</html>
