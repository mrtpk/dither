<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dither Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      min-height: 100vh;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #333;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 57px);
    }

    .sidebar {
      width: 280px;
      flex-shrink: 0;
      padding: 1.25rem;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .preview {
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      overflow: auto;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: #aaa;
    }

    label span.label-text {
      font-weight: 500;
      color: #ccc;
    }

    select, input[type="range"] {
      width: 100%;
    }

    select {
      padding: 0.4rem;
      background: #2a2a2a;
      color: #e8e8e8;
      border: 1px solid #444;
      border-radius: 4px;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .range-row output {
      min-width: 2.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #e8e8e8;
    }

    .checkbox-label {
      flex-direction: row;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .checkbox-label input {
      width: auto;
    }

    .file-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .file-row input[type="file"] {
      font-size: 0.8rem;
    }

    #fileName {
      font-size: 0.75rem;
      color: #888;
      word-break: break-all;
    }

    button {
      padding: 0.6rem 1rem;
      background: #3a6ea5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover {
      background: #4a7eb5;
    }

    #displayCanvas {
      max-width: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #111;
    }

    #sizeReadout {
      font-size: 0.85rem;
      color: #888;
      font-variant-numeric: tabular-nums;
    }

    label.disabled {
      opacity: 0.45;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>Dither Tool</header>
  <div class="layout">
    <aside class="sidebar">
      <div class="file-row">
        <label>
          <span class="label-text">Load image</span>
          <input type="file" id="fileInput" accept="image/*">
        </label>
        <span id="fileName">01a.png</span>
      </div>

      <label>
        <span class="label-text">Algorithm</span>
        <select id="algorithm"></select>
      </label>

      <label>
        <span class="label-text">Palette</span>
        <select id="palette"></select>
      </label>

      <label>
        <span class="label-text">Contrast</span>
        <div class="range-row">
          <input type="range" id="contrast" min="0.25" max="3" step="0.05" value="1">
          <output id="contrastOut">1.00</output>
        </div>
      </label>

      <label>
        <span class="label-text">Brightness</span>
        <div class="range-row">
          <input type="range" id="brightness" min="-128" max="128" step="1" value="0">
          <output id="brightnessOut">0</output>
        </div>
      </label>

      <label>
        <span class="label-text">Pixel scale</span>
        <div class="range-row">
          <input type="range" id="pixelScale" min="1" max="32" step="1" value="1">
          <output id="pixelScaleOut">1</output>
        </div>
      </label>

      <label id="strengthLabel">
        <span class="label-text">Strength</span>
        <div class="range-row">
          <input type="range" id="strength" min="0" max="2" step="0.05" value="1" disabled>
          <output id="strengthOut">1.00</output>
        </div>
      </label>

      <label class="checkbox-label">
        <input type="checkbox" id="invert">
        <span class="label-text">Invert</span>
      </label>

      <button type="button" id="downloadBtn">Download PNG</button>
    </aside>

    <main class="preview">
      <canvas id="displayCanvas"></canvas>
      <canvas id="workCanvas" hidden></canvas>
      <p id="sizeReadout">—</p>
    </main>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
